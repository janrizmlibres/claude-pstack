# The weekly sync. A shell gate decides without a model call: it stops when
# upstream matches the snapshot, and comments on an open sync PR instead of
# starting another. Otherwise Claude runs the repo-local /sync-upstream skill
# at the upstream commit the gate saw, which opens one PR on sync/<version>
# against the branch this run is on. Nothing merges itself.
#
# Needs the CLAUDE_CODE_OAUTH_TOKEN secret (from `claude setup-token`) and the
# repo setting "Allow GitHub Actions to create and approve pull requests".
# Sync PRs are opened with the default GITHUB_TOKEN: no GitHub App or PAT.
name: Sync upstream

on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: sync
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Gate
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/sync-gate.ts
      - name: Commit identity
        if: steps.gate.outputs.sync == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
      - name: Sync
        if: steps.gate.outputs.sync == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: "/sync-upstream ${{ steps.gate.outputs.commit }}"
          claude_args: |
            --model opus
            --allowedTools "Read,Write,Edit,Glob,Grep,Agent,Bash(bun scripts/:*),Bash(bun run:*),Bash(git:*),Bash(gh api repos/cursor/plugins/:*),Bash(gh pr create:*),Bash(npm pack:*),Bash(tar:*),Bash(mkdir:*),Bash(cp:*),Bash(rm:*),Bash(ls:*)"
